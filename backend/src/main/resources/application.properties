spring.application.name=backend

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/shubhojeet2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# ===============================
# Gemini AI Configuration
# ===============================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

# ===============================
# Gemini OpenAI-Compatible API
# ===============================
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.timeout=120s
spring.ai.openai.chat.model=${GEMINI_OPENAI_MODEL:gemini-2.5-flash}
spring.ai.openai.chat.reasoning-effort=low

# Embeddings
spring.ai.openai.embedding.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# ===============================
# PgVector
# ===============================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ===============================
# GitHub OAuth2
# ===============================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# ===============================
# Session Configuration
# ===============================
server.servlet.session.cookie.name=SHUBHOJEET_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# ===============================
# Application Settings
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===============================
# Token Encryption
# ===============================
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}

# ===============================
# File Indexing
# ===============================
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100

# ===============================
# GitHub API
# ===============================
app.github.api-delay-ms=50